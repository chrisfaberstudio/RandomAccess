<!DOCTYPE html>
        <html lang="en">
        
        <head>
            <title>ERA</title>
            <link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
            <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
            <link type="text/css" rel="stylesheet" href="main.css">
        </head>
        
        <body>
        
            <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
        
            <style>
                * {
                    margin: 0;
                    padding: 0;
                }
        
                html {
                    height: 100%;
                    width: 100%;
                }
        
                body {
                    height: 100%;
                    width: 100%;
                    background-color: purple; /* Added purple background */
                }
        
                model-viewer {
                    height: 100%;
                    width: 100%;
                }
            </style>
        
            <model-viewer
        
                src="assets/asset.glb"
                ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"
                camera-controls
                auto-rotate
                camera-target="0m 0.10m 0m"
                autoplay
                tone-mapping="neutral"
                shadow-intensity="1"
                environment-image="assets/paul_lobe_haus_1k_bw.hdr"
                exposure="1"
                ios-src="assets/asset.usdz"
                button class="Hotspot" slot="hotspot-1" data-position="-0.00024275262474935527m 0.14718120471443644m 0.055674547894458484m" data-normal="-0.002655067150348356m 0.5873391832323374m 0.8093365396782712m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation">THE SUN</div>
                </button><button class="Hotspot" slot="hotspot-2" data-position="-0.018908198602185552m 0.19360159758380155m -0.1269980223409639m" data-normal="-0.6184049968735027m 0.49767922052702634m -0.6081863639522795m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation">THE Rise</div>
                </button><button class="Hotspot" slot="hotspot-3" data-position="-0.0669111779901567m 0.051497988556738816m 0.03763415069694173m" data-normal="-0.9996482849849793m 0.0032281786921405466m 0.02632271241573414m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation">TOGEHTER WE RISE</div>
        
            </model-viewer>
        
        </body>
        </html>
