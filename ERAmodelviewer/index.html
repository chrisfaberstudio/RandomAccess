<!DOCTYPE html>
<html lang="en">

<head>
    <title>ERA</title>
    <link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
</head>

<body>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            width: 100%;
        }

        body {
            height: 100%;
            width: 100%;
            background-color: purple; /* Added purple background */
        }

        model-viewer {
            height: 100%;
            width: 100%;
        }
    </style>

    <model-viewer

        src="assets/asset.glb"
        ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"
        camera-controls
        auto-rotate
        camera-target="0m 0.10m 0m"
        autoplay
        tone-mapping="neutral"
        shadow-intensity="1"
        environment-image="assets/paul_lobe_haus_1k_bw.hdr"
        exposure="0.7"
        ios-src="assets/asset.usdz">

    </model-viewer>

</body>
</html>
