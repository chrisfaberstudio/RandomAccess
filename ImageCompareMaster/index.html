<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Image Comparison Slider</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="wrapper">
      <div class="images">
        <div class="img-1"></div>
        <div class="img-2"></div>
      </div>
      <div class="slider">
        <div class="drag-line">
          <span class="left"></span> <!-- Left Arrow -->
          <span class="right"></span> <!-- Right Arrow -->
        </div>
        <input type="range" min="0" max="100" value="50">
      </div>
    </div>
    
    <script>
      const slider = document.querySelector(".slider input");
      const img2 = document.querySelector(".images .img-2");
      const dragLine = document.querySelector(".slider .drag-line");

      slider.addEventListener("input", () => {
        let sliderVal = slider.value;
        dragLine.style.left = sliderVal + "%";
        // Directly adjust the clip-path of img-2 based on slider value
        img2.style.clipPath = `polygon(0 0, ${sliderVal}% 0, ${sliderVal}% 100%, 0 100%)`;
      });
    </script>
  </body>
</html>
