<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Image Comparison Slider</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="wrapper">
      <div class="images">
        <div class="img-1"></div>
        <div class="img-2"></div>
      </div>
      <div class="slider">
        <div class="drag-line">
          <span></span>
        </div>
        <input type="range" min="0" max="100" value="50">
      </div>
    </div>
    
    <script>
      const slider = document.querySelector(".slider input");
      const img2 = document.querySelector(".images .img-2");
      const dragLine = document.querySelector(".slider .drag-line");

      slider.oninput = () => {
        let sliderVal = slider.value;
        dragLine.style.left = sliderVal + "%";
        // Change the width of img-2 based on the slider value
        img2.style.width = (100 - sliderVal) + "%";
      };
    </script>
  </body>
</html>
